name: Job Search Automatique

on:
  schedule:
    # Lundi-Vendredi: 7h, 12h, 18h (heure de Paris = UTC+2 en été)
    - cron: '0 5,10,16 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no apply)'
        type: boolean
        default: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bot/package-lock.json

      - name: Install bot dependencies
        run: cd bot && npm ci --omit=dev --ignore-scripts

      - name: Run search (France Travail + WTTJ — sans navigateur)
        run: cd bot && npx tsx src/search-ft.ts
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          USER_FULL_NAME: ${{ secrets.USER_FULL_NAME }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PHONE: ${{ secrets.USER_PHONE }}

      - name: Commit new jobs data
        run: |
          git config user.email "jobbot@viralstudio.local"
          git config user.name "Job Bot"
          git add bot/data/jobs.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Aucune nouvelle offre."
          else
            git commit -m "chore: mise à jour offres $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
